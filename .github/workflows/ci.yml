name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Roster rule (CLAUDE.md): every agent in .claude/agents/ is in the chief-of-staff roster.
  agents:
    name: Agent roster
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-agents.sh

  # TDPM (CLAUDE.md rule 9): every product decision has a full persona check; Reds need a resolution.
  persona-checks:
    name: Persona checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/tests/check_persona_checks_test.sh

  # PRIV-2 (CLAUDE.md rule 2): no console.* call logs a key, URL, caption, email or raw error.
  logs:
    name: No secrets in logs
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/tests/check_logs_test.sh

  # EXPO-4 (docs/eng/LESSONS.md): the app's SDK is the one the App Store's Expo Go runs. Goes red on its
  # own when Expo ships a new Expo Go; that is the alarm, not a flake.
  expo-go:
    name: Expo Go runs our SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/tests/check_expo_go_test.sh
      - run: bash scripts/check-expo-go.sh

  # STARTER-* (docs/supabase-starter/): the reusable Supabase pieces, on plain Postgres. The invite SQL runs
  # on top of the studio template it extends (studio-agents PR #11, pinned by commit).
  supabase-starter:
    name: Supabase starter (invites, deploy, smoke check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: holroydchase-afk/studio-agents
          ref: 5a903000543367c0e936e3f7ad9ad3d4712ca0af
          path: studio-agents
      - name: Postgres (preinstalled on the runner)
        run: sudo systemctl start postgresql && sudo -u postgres createuser -s "$USER"
      - run: bash docs/supabase-starter/tests/scripts_test.sh
      - run: bash docs/supabase-starter/tests/run-with-template.sh studio-agents/templates/supabase

  # ---------------------------------------------------------------------------
  # Backend on a REAL local Supabase stack (S16): Postgres + GoTrue + PostgREST + Kong.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend on supabase start (SQL + Deno)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_CLI: npx --yes supabase@2.121.0
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deploy.sh uses only the access token (DEPLOY-1, stubbed, no network)
        run: bash tests/deploy/deploy_test.sh

      - name: psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Start Supabase (db, auth, rest, kong only)
        run: $SUPABASE_CLI start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: SQL suites on the real stack (rls_test + api_test, fresh db reset each)
        run: bash tests/run_supabase.sh

      - name: Deno - sign-media + notify unit tests
        run: deno test --allow-env --allow-read supabase/functions/sign-media/ supabase/functions/notify/ tests/templates/

      - name: Deno - real-API smoke test through Kong + PostgREST
        run: |
          $SUPABASE_CLI db reset --local
          bash tests/integration/supabase_harness.sh > "$RUNNER_TEMP/harness.json"
          HARNESS_JSON="$RUNNER_TEMP/harness.json" deno test --allow-read --allow-net --allow-env tests/integration/

      - name: Stop Supabase
        if: always()
        run: $SUPABASE_CLI stop --no-backup

  # ---------------------------------------------------------------------------
  # APP: Jest (unit, screens, contract vs FakeApi) + strict typecheck.
  # ---------------------------------------------------------------------------
  app:
    name: App (Jest + typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: npm run eas works with only EXPO_ACCESS_TOKEN (EXPO-1, stubbed, no network)
        run: bash scripts/tests/eas_test.sh
      - run: npm test
      - run: npm run typecheck
