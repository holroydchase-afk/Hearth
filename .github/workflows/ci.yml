name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend on a REAL local Supabase stack (S16): Postgres + GoTrue + PostgREST + Kong.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend on supabase start (SQL + Deno)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_CLI: npx --yes supabase@2.121.0
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Start Supabase (db, auth, rest, kong only)
        run: $SUPABASE_CLI start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: SQL suites on the real stack (rls_test + api_test, fresh db reset each)
        run: bash tests/run_supabase.sh

      - name: Deno - sign-media unit tests
        run: deno test --allow-env supabase/functions/sign-media/

      - name: Deno - real-API smoke test through Kong + PostgREST
        run: |
          $SUPABASE_CLI db reset --local
          bash tests/integration/supabase_harness.sh > "$RUNNER_TEMP/harness.json"
          HARNESS_JSON="$RUNNER_TEMP/harness.json" deno test --allow-read --allow-net --allow-env tests/integration/

      - name: Stop Supabase
        if: always()
        run: $SUPABASE_CLI stop --no-backup

  # ---------------------------------------------------------------------------
  # APP — STUB. Owned by the app lane (app/). Wire up more steps (lint, e2e) there.
  # ---------------------------------------------------------------------------
  app:
    name: App (STUB - app lane)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
