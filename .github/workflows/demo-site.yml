name: demo-site
# Builds the no-login demo (made-up family, no backend) with scripts/build-demo.sh and keeps it as a
# downloadable artifact for the portfolio site to host at chaseholroyd.com/demo/hearth/.
# Manual only: nothing is published from here, and nothing in it depends on the app's final name.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Sub-path the site serves the demo from
        default: /demo/hearth
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: bash scripts/build-demo.sh "$BASE"
        env:
          BASE: ${{ inputs.base }}
      - name: The demo never points at a real backend
        run: |
          if grep -rlE '[a-z]{20}\.supabase\.co|sb_(secret|publishable)_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ' dist-demo-site; then
            echo "::error::The demo build contains a Supabase address or key"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-demo-site
          path: app/dist-demo-site
          retention-days: 30
