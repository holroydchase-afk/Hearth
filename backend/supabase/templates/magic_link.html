<!-- JOIN-2: the 6-number code in plain words. No links (a link-only email looks like a scam). -->
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; line-height: 1.5; color: #222; max-width: 560px;">
  <p>Here is your code for Hearth, your family's private photos:</p>
  <p style="font-size: 40px; font-weight: bold; letter-spacing: 8px; margin: 24px 0;">{{ .Token }}</p>
  <p>Type these 6 numbers in Hearth. The code works for 1 hour.</p>
  <p>Hearth will never ask for a password, and never asks you to pay.</p>
  <p style="color: #555;">Didn't ask for a code? You can ignore this email. Nobody can get in without it.</p>
</div>
